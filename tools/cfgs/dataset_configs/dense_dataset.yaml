DATASET: 'DenseDataset'
DATA_PATH: '../data/dense'

POINT_CLOUD_RANGE: [0, -40, -3, 70.4, 40, 1]

DATA_SPLIT: {
    'train': train_clear,
    'test': val_clear
}

INFO_PATH: {
    'train': [dense_infos_train_clear.pkl],
    'test': [dense_infos_val_clear.pkl],
}

SENSOR_TYPE: 'hdl64'
SIGNAL_TYPE: 'strongest'
LIDAR_FOLDER: 'lidar_hdl64_strongest'
NUM_POINT_FEATURES: 5
FOV_POINTS_ONLY: True

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          DB_INFO_PATH:
              - dense_dbinfos_train_clear.pkl
          PREPARE: {
             filter_by_min_points: ['Car:5', 'Pedestrian:5', 'Cyclist:5', 'Van:5'],
             filter_by_difficulty: [-1],
          }

          SAMPLE_GROUPS: ['Car:15', 'Pedestrian:10', 'Cyclist:10', 'Van:10']
          NUM_POINT_FEATURES: 5
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: False

        - NAME: random_world_flip
          ENABLE_PROB: 0.5
          ALONG_AXIS_LIST: ['x']

        - NAME: random_box_noise
          ENABLE_PROB: 0.5
          LOC_NOISE: [1.0, 1.0, 0.0]
          SCALE_RANGE: [1.0, 1.0]
          ROTATION_RANGE: [-1.04719755, 1.04719755]

        - NAME: random_world_rotation
          ENABLE_PROB: 0.5
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          ENABLE_PROB: 0.5
          WORLD_SCALE_RANGE: [0.9, 1.1]

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity', 'elongation'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'elongation'],
}

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: sample_points
      NUM_POINTS: {
        'train': 16384,
        'test': 16384
      }

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }
